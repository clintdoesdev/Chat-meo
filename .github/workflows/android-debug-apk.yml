name: Android debug APK

# Builds Chatmeo's native Android app (android/ — Kotlin + Jetpack Compose, talking to
# /api/v1/* over Retrofit, no WebView involved) and uploads a debug APK as this run's artifact,
# for installing on a device/emulator to check the native app itself without Android Studio.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # AGP 8.13 itself only needs 17, but the app module's own build.gradle.kts sets
          # sourceCompatibility/targetCompatibility to 17 as well — this just has to be >= that.
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write google-services.json
        # Firebase config — gitignored (android/.gitignore) since it's per-project and machine/CI
        # specific, not something to commit. Not a high-sensitivity secret in the way an API
        # server key is (Firebase's own docs note the Android client config is safe to ship inside
        # an APK — real access control is the package name + signing cert, not this file's
        # contents) but it's still project-specific, hence a repo secret rather than committing it.
        working-directory: android/app
        run: echo "$GOOGLE_SERVICES_JSON" > google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chatmeo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
