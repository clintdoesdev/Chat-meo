name: Android debug APK

# Chatmeo's Android shell (capacitor.config.ts) just points a native WebView at the deployed
# site — there's no web build to bundle here, only the Capacitor/Gradle project under android/.
# This exists purely so a debug APK is always one click away in the Actions run's Artifacts
# list, for installing on a device/emulator to sanity-check the native wrapper itself (icon,
# splash screen, permissions, deep links) without needing Android Studio locally.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Regenerates android/app/src/main/assets/public + the Capacitor config/plugin manifests
      # Gradle needs to build — none of that is committed (see android/.gitignore), since it's
      # fully derived from capacitor.config.ts and the installed @capacitor/* plugins.
      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chatmeo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
